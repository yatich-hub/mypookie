<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Valentine's Day, Mercy 💘</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:black;
    font-family:'Segoe UI',sans-serif;
    overflow:hidden;
}

/* PINNED VIDEO BACKGROUND */
#bg-video{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
    z-index:-2;
    pointer-events:none;
    filter:brightness(0.55) blur(1px);
}

/* DARK OVERLAY */
body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    background:rgba(0,0,0,0.35);
    z-index:-1;
}

/* CARD */
.card{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(12px);
    padding:50px;
    border-radius:25px;
    text-align:center;
    color:white;
    max-width:650px;
    box-shadow:0 20px 40px rgba(0,0,0,0.4);
    cursor:pointer;
}

h1{font-size:40px}

/* MESSAGE */
#message{
    display:none;
    font-size:20px;
    line-height:1.6;
}

/* SLIDESHOW */
.slideshow{
    display:none;
    margin-top:20px;
}
.slide{
    width:100%;
    height:320px;
    object-fit:cover;
    border-radius:15px;
    display:none;
}

/* FLOATING HEARTS */
.floating-heart{
    position:absolute;
    bottom:-20px;
    font-size:20px;
    animation:floatUp 6s linear infinite;
}
@keyframes floatUp{
    0%{transform:translateY(0)}
    100%{transform:translateY(-110vh);opacity:0}
}
</style>
</head>

<body>

<!-- BACKGROUND VIDEO -->
<video id="bg-video" autoplay muted loop playsinline>
<source src="https://cdn.pixabay.com/vimeo/328940142/heart-19698.mp4" type="video/mp4">
</video>

<div class="card" id="card">
<h1>Happy Valentine's Day, Mercy 💘</h1>

<p id="message">
You are the most beautiful part of my life ❤️<br><br>
Every day with you feels softer, brighter and meaningful.<br><br>
I love you more than words can ever explain.
</p>

<!-- PHOTO SLIDESHOW -->
<div class="slideshow" id="slideshow">
<img class="slide" src="https://images.unsplash.com/photo-1518199266791-5375a83190b7">
<img class="slide" src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2">
<img class="slide" src="https://images.unsplash.com/photo-1511988617509-a57c8a288659">
</div>

<small>Click the card 💌</small>
</div>

<!-- MUSIC -->
<audio id="song"
src="https://cdn.pixabay.com/download/audio/2021/12/23/audio_f5e36f7806.mp3?filename=happy-love-11788.mp3"
loop></audio>

<script>
const card=document.getElementById('card');
const message=document.getElementById('message');
const slideshow=document.getElementById('slideshow');
const slides=document.querySelectorAll('.slide');
const audio=document.getElementById('song');

let opened=false;
let current=0;

/* CLICK CARD */
card.addEventListener('click',()=>{
 if(!opened){
   message.style.display='block';
   slideshow.style.display='block';
   opened=true;

   /* PLAY MUSIC */
   audio.volume=0;
   audio.play().catch(()=>{});
   let vol=0;
   const fade=setInterval(()=>{
     if(vol<0.5){vol+=0.02;audio.volume=vol;}
     else clearInterval(fade);
   },200);

   startSlideshow();
 }
});

/* SLIDESHOW */
function startSlideshow(){
 slides[current].style.display="block";
 setInterval(()=>{
   slides[current].style.display="none";
   current=(current+1)%slides.length;
   slides[current].style.display="block";
 },3000);
}

/* FLOATING HEARTS */
function createHeart(){
 const heart=document.createElement("div");
 heart.className="floating-heart";
 heart.innerHTML="💖";
 heart.style.left=Math.random()*100+"vw";
 document.body.appendChild(heart);
 setTimeout(()=>heart.remove(),6000);
}
setInterval(createHeart,500);
</script>

</body>
</html>
